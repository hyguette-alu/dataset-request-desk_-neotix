server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The SPA and the API are served from one origin. That is why the session
    # can be an HttpOnly cookie with SameSite=Lax and no CORS configuration
    # exists anywhere in this project.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generous, because a large CSV import is a slow request.
        proxy_read_timeout 300s;
        client_max_body_size 64m;
    }

    # Client-side routing: unknown paths return the app, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json;
}
